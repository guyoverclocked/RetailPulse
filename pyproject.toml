[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retailpulse"
version = "0.1.0"
description = "Probabilistic multi-store demand forecasting and workforce planning"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.0",
    "fastapi>=0.115",
    "lightgbm>=4.5",
    "mlflow>=2.17",
    "mlforecast>=0.14",
    "numpy>=1.26",
    "optuna>=4.0",
    "ortools>=9.11",
    "pandas>=2.2",
    "pandera>=0.20",
    "plotly>=5.24",
    "polars>=1.5",
    "prefect>=3.0",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "rich>=13.7",
    "scikit-learn>=1.5",
    "statsforecast>=1.7",
    "streamlit>=1.39",
    "tabulate>=0.9",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
challengers = [
    "chronos-forecasting>=1.4",
    "darts>=0.31",
    "torch>=2.4",
]
gcp = [
    "google-cloud-bigquery>=3.25",
    "google-cloud-run>=0.10",
    "google-cloud-storage>=2.18",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
retailpulse = "retailpulse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/retailpulse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "T20", "RUF"]
ignore = ["T20"] # TODO tracking is managed in the Obsidian vault, not code comments

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["lightgbm.*", "mlforecast.*", "statsforecast.*", "ortools.*", "mlflow.*", "optuna.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
