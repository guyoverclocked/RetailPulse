# Data pipeline settings.
paths:
  raw_dir: data/raw
  curated_dir: data/processed
  features_dir: data/features
  artifacts_dir: artifacts
  duckdb_file: artifacts/retailpulse.duckdb
  manifest_file: data/processed/manifest.json

source:
  # Kaggle "rossmann-store-sales" competition data.
  kaggle_dataset: rossmann-store-sales
  train_file: train.csv
  store_file: store.csv

synthetic:
  seed: 42
  n_stores: 60
  start_date: "2013-01-01"
  end_date: "2015-07-31"
  store_types: [a, b, c, d]
  assortments: [a, b, c]
  promo_rate: 0.15
  closure_rate: 0.08
  school_holiday_rate: 0.15
  state_holiday_rate: 0.03
  competition_distance_scale: 5000.0
  promo2_rate: 0.5

fixture:
  # Tiny committed fixture for CI (tests/fixtures/sample/).
  n_stores: 10
  start_date: "2014-01-01"
  end_date: "2014-06-30"
